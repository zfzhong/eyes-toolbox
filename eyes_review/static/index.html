}

// ---- quick action: one ruling for many blocks (still the reviewer's decision, two clicks)
const BULK_CHOICES = [["Off", "Off"], ["Idle", "Idle"], ["Active", "Active"], ["still_unsure", "Still unsure"], ["", "Remove ruling"]];
function renderBulk() {
  const sel = BL.list.filter(b => BL.selected.has(b.block_id));
  const n = sel.length, h = sel.reduce((a, b) => a + b.duration_s, 0) / 3600;
  const withEv = sel.filter(b => b.n_events > 2).length;
  const all = BL.list.length && n === BL.list.length;
  const choice = BL.bulkChoice ?? "Off", name = (BULK_CHOICES.find(c => c[0] === choice) || [])[1];
  $("#bl-bulk").innerHTML = `<label><input type="checkbox" id="bl-all" ${all ? "checked" : ""}> select all shown (${BL.list.length.toLocaleString()})</label>
    <span><b>${n.toLocaleString()}</b> selected${n ? ` · ${h.toFixed(0)} h` : ""}${withEv ? ` · <span class="warn">${withEv} with events inside</span>` : ""}</span>
    ${n ? (BL.confirm
      ? `<span style="flex-basis:100%">${withEv && choice === "Off" ? `<span class="warn">${withEv} of these have events inside: the device logged something during them.</span> ` : ""}
           Rule <b>${n.toLocaleString()}</b> blocks (${h.toFixed(0)} h) as <b>${esc(name)}</b>?</span>
         <button class="danger" id="bl-bconfirm">Confirm</button><button id="bl-bcancel">Cancel</button>`
      : `<select id="bl-bchoice">${BULK_CHOICES.map(([v, l]) => `<option value="${v}" ${v === choice ? "selected" : ""}>${l}</option>`).join("")}</select>
         <input type="text" id="bl-bnote" placeholder="Note" value="${esc(BL.bulkNote || "")}">
         <button class="primary" id="bl-bapply">Apply…</button>`) : ""}
    <span id="bl-bmsg"></span>`;
  $("#bl-all").onchange = e => {
    BL.selected = e.target.checked ? new Set(BL.list.map(b => b.block_id)) : new Set();
    BL.confirm = false; renderBlockList();
  };
  if ($("#bl-bchoice")) $("#bl-bchoice").onchange = e => { BL.bulkChoice = e.target.value; };
  if ($("#bl-bnote")) $("#bl-bnote").oninput = e => { BL.bulkNote = e.target.value; };
  if ($("#bl-bapply")) $("#bl-bapply").onclick = () => { BL.bulkChoice = $("#bl-bchoice").value; BL.confirm = true; renderBulk(); };
  if ($("#bl-bcancel")) $("#bl-bcancel").onclick = () => { BL.confirm = false; renderBulk(); };
  if ($("#bl-bconfirm")) $("#bl-bconfirm").onclick = applyBulk;
}
async function applyBulk() {
  const ids = [...BL.selected], label = BL.bulkChoice ?? "Off";
  $("#bl-bconfirm").disabled = true;
  const r = await post("/api/states/rulings_bulk", {block_ids: ids, label, note: BL.bulkNote || ""});
  BL.selected = new Set(); BL.confirm = false;
  await loadBlocks(true);
  loadBlockSummary();
  $("#bl-bmsg").innerHTML = `<span class="flash">${label ? "Ruled" : "Cleared"} ${r.n.toLocaleString()} blocks</span>`;
}

async function loadBlockSummary() {
  BL.summary = await api("/api/states/summary" + (BL.fileFilter ? `?file_id=${BL.fileFilter.id}` : ""));
  if (!BL.cur && BL.mode === "blocks") renderBlockSummary();
}

function renderBlockSummary() {
  const s = BL.summary;
  if (!s) return;
  const by = (L, l) => s.counts.find(x => x.layer === L && x.label === l) || {n: 0, hours: 0};
  const CONF = ["Off", "Idle", "Active"], UNS = ["Unsure OI", "Unsure IA", "Unsure OA", "Unsure 3"];
  const table = L => {
    const sum = (ls, k) => ls.reduce((a, l) => a + by(L, l)[k], 0);
    const N = sum(ST_LABELS, "n") || 1, H = sum(ST_LABELS, "hours") || 1;
    const cells = (n, h, b) => { const w = x => b ? `<b>${x}</b>` : x;
      return `<td class="num">${w(n.toLocaleString())}</td><td class="num">${w((100 * n / N).toFixed(1))}</td><td class="num">${w(h.toFixed(0))}</td><td class="num">${w((100 * h / H).toFixed(1))}</td>`; };
    const row = l => `<tr><td style="padding-left:22px"><span class="sw" style="background:${stCol(l)}"></span>${l}</td>${cells(by(L, l).n, by(L, l).hours)}</tr>`;
    const tot = (name, ls) => `<tr><td><b>${name}</b></td>${cells(sum(ls, "n"), sum(ls, "hours"), true)}</tr>`;
    const lst = s.listed.find(x => x.layer === L) || {n: 0, reviewed: 0, hours: 0};
    const ruled = s.ruled.filter(x => x.layer === L);
    return `<div class="card"><h2>${L === "likely" ? "Likely" : "Strict"} layer <span class="small">${N.toLocaleString()} blocks · ${H.toFixed(0)} h</span></h2>
      <table class="stattbl" style="max-width:600px"><thead><tr><th>Blocks</th><th class="num">Count</th><th class="num">%</th><th class="num">Hours</th><th class="num">%</th></tr></thead>
      <tbody>${tot("Confirmed", CONF)}${CONF.map(row).join("")}${tot("Unsure", UNS)}${UNS.map(row).join("")}</tbody></table>
      <div class="small" style="margin-top:6px">Review list: ${lst.n.toLocaleString()} quiet stretches (${(lst.hours || 0).toFixed(0)} h), each a gap with no event, ≥ 5 min${lst.n_check ? `; of them ${lst.n_check.toLocaleString()} continuity checks` : ""}${lst.n_conflict ? `, ${lst.n_conflict.toLocaleString()} conflicts` : ""}${lst.n_long ? `, ${lst.n_long.toLocaleString()} long On checks` : ""} · reviewed <b>${(lst.reviewed || 0).toLocaleString()}</b>
      ${ruled.length ? `<br>Your rulings: ${ruled.map(x => `${esc(UNS.includes(x.label) ? "still unsure" : x.label)} ${x.n} (${x.hours.toFixed(1)} h)`).join(" · ")}` : ""}</div></div>`;
  };
  const step1 = () => {
    const g = s.signs || [];
    if (!g.length) return "";
    const N = g.reduce((a, x) => a + x.n, 0) || 1, H = g.reduce((a, x) => a + x.hours, 0) || 1;
    const V = ["Off", "On", "Conflict", "Unsure"];
    const row = (name, n, h, bold, pad) => `<tr><td style="${pad ? "padding-left:22px" : ""}">${bold ? `<b>${name}</b>` : name}</td>
      <td class="num">${bold ? `<b>${n.toLocaleString()}</b>` : n.toLocaleString()}</td><td class="num">${(100 * n / N).toFixed(2)}</td>
      <td class="num">${bold ? `<b>${h.toFixed(0)}</b>` : h.toFixed(0)}</td><td class="num">${(100 * h / H).toFixed(1)}</td></tr>`;
    const sig = (s.signatures || []).map(x => `${x.files} files: ${x.signature === "device" ? "their own" : x.signature === "pooled" ? "the pooled one" : "none"}`).join(" · ");
    return `<div class="card"><h2>Step 1: was the device Off or On? <span class="small">${N.toLocaleString()} quiet stretches ≥ 5 min · ${H.toFixed(0)} h</span></h2>
      <table class="stattbl" style="max-width:640px"><thead><tr><th>Verdict and the sign that decided it</th><th class="num">Stretches</th><th class="num">%</th><th class="num">Hours</th><th class="num">%</th></tr></thead><tbody>
      ${V.map(v => { const x = g.filter(y => y.verdict === v); if (!x.length) return "";
        return row(v, x.reduce((a, y) => a + y.n, 0), x.reduce((a, y) => a + y.hours, 0), true)
          + (v === "Unsure" ? "" : x.map(y => row(esc(signName(y.how)), y.n, y.hours, false, true)).join("")); }).join("")}
      </tbody></table><div class="small" style="margin-top:6px">Boot signature used: ${sig}</div></div>`;
  };
  $("#st-detail").innerHTML = `<div class="small" style="margin-bottom:10px">Device-state blocks ${BL.fileFilter ? "for <b>" + esc(BL.fileFilter.name) + "</b>" : "in all files"}.
    A block is a stretch of time with one label (it can contain events). What you review are the <b>quiet stretches</b>:
    gaps between two consecutive events, with no event at all, of 5 minutes or more, whose state is still unsure. Pick one on the left (longest first).</div>`
    + step1() + table(ST.layer) + table(ST.layer === "likely" ? "strict" : "likely");
}

async function openBlock(id) {

// ---- segment profile: the three tracks of a file around the open stretch
const PF = {pad: null};
const PF_LANES_ALL = [["silence", "Silence"], ["power", "Power"], ["screen", "Screen"], ["lock", "Lock"], ["heartbeat", "Background"], ["service", "Service"], ["car", "Car screen"], ["chain", "App chain"], ["app", "App in front"], ["pip", "Small window"]];
const PF_COL = {silence: "#9aa0a6", off: "var(--st-off)", storm: "#d9480f", screen_on: "var(--st-active)", screen_off: "var(--st-idle)",
  screen_unknown: "#c9c9c9", unlocked: "#7fb77e", locked: "#b9b2a3", heartbeat: "#8fa8c8"};
const appHue = a => { let h = 0; for (const c of a) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
async function drawProfile() {
  const b = BL.data.block, el = $("#pf-lanes");
  if (PF.pad == null) PF.pad = Math.max(1800, b.duration_s * 0.5);
  const t0 = b.start - PF.pad, t1 = b.end + PF.pad, id = BL.cur;
  const d = await api(`/api/states/profile/${b.file_id}?t0=${t0}&t1=${t1}`);
  if (id !== BL.cur || !$("#pf-lanes")) return;
  if (d.missing) { el.innerHTML = `<div class="small">No profile for this file yet (run eyeslib.runners.run_profiles).</div>`; return; }
  const PF_LANES = PF_LANES_ALL;
  const W = Math.max(600, el.clientWidth || 900), L = 100, R = 10, lh = 22, top = 6, H = top + PF_LANES.length * lh + 22;
  const X = t => L + (Math.min(Math.max(t, t0), t1) - t0) / (t1 - t0) * (W - L - R);
  const y = k => top + k * lh, lane = Object.fromEntries(PF_LANES.map(([k], i) => [k, i]));
  const tip = (s, extra) => `${extra} · ${fmt(s.start, b.tz, "mdt")} → ${fmt(s.end, b.tz, "mdt")} · ${dur(s.end - s.start)}`;
  let g = PF_LANES.map(([k, name], i) => `<text x="4" y="${y(i) + 14}" font-size="11" fill="var(--muted, #666)">${name}</text>
    <line x1="${L}" x2="${W - R}" y1="${y(i) + lh - 2}" y2="${y(i) + lh - 2}" stroke="var(--line)" stroke-width="0.5"/>`).join("");
  const bar = (s, k, col, label, o = {}) => { const x0 = X(s.start), w = Math.max(o.min || 1, X(s.end) - x0);
    return `<rect x="${x0}" y="${y(k) + 3}" width="${w}" height="${lh - 8}" fill="${col}" ${o.dash ? `stroke="#b00" stroke-dasharray="3 2"` : ""}><title>${esc(tip(s, label))}</title></rect>`; };
  const mark = (s, k, col, label) => `<path d="M${X(s.start)} ${y(k) + 2} v${lh - 6}" stroke="${col}" stroke-width="2"><title>${esc(label + " · " + fmt(s.start, b.tz, "mdt"))}</title></path>`;
  for (const s of d.profile) {
    if (s.kind === "silence") g += bar(s, lane.silence, PF_COL.silence, "silence");
    else if (s.kind === "off") g += bar(s, lane.power, PF_COL.off, "Off (" + signName(s.flag) + ")");
    else if (s.kind === "storm") g += bar(s, lane.power, PF_COL.storm, `boot storm, ${s.n} standby changes`, {min: 3});
    else if (["shutdown", "startup", "user_unlocked"].includes(s.kind)) g += mark(s, lane.power, s.kind === "shutdown" ? "#000" : "#0a7", {shutdown: "Device Shutdown", startup: "Device Startup", user_unlocked: "User Unlocked"}[s.kind]);
    else if (s.kind.startsWith("screen_")) g += bar(s, lane.screen, PF_COL[s.kind], s.kind.replace("_", " ") + (s.flag ? " (" + s.flag + ")" : ""), {dash: !!s.flag});
    else if (s.kind === "unlocked" || s.kind === "locked") g += bar(s, lane.lock, PF_COL[s.kind], s.kind);
    else if (s.kind === "heartbeat") g += bar(s, lane.heartbeat, PF_COL.heartbeat, `${s.n} background events`);
    else if (s.kind === "car") g += bar(s, lane.car, "#d8c7ef", "car session (Android Auto service)" + (s.grade ? " · " + s.grade : ""));
    else if (s.kind === "visible") g += bar(s, lane.pip, "#c9cdd2", `still visible, cause unknown: ${s.app}, ${dur(s.end - s.start)} (not an app that has a small window)`, {min: 2, dash: true});
    else if (s.kind === "cover") g += bar(s, lane.pip, `hsl(${appHue(s.app)} 30% 75%)`, `covered by a panel: ${s.app}, ${dur(s.end - s.start)}, with ${s.flag} over it` + (s.grade ? " · " + s.grade : ""), {min: 2, dash: true});
    else if (s.kind.startsWith("pip")) g += bar(s, lane.pip, `hsl(${appHue(s.app)} 55% 55%)`, `small window: ${s.app}, ${dur(s.end - s.start)}, ${s.kind === "pip_wake" ? "came back when the screen was turned on" : "opened by leaving the app"}, ${s.kind === "pip_back" ? "ended by returning to the app" : s.kind === "pip" ? "ended by closing it or by the screen going off" : "until its next Stopped or Resumed"}` + (s.flag === "cut at screen-off" ? ", cut at a screen-off (its end was not logged)" : s.flag === "near the file's Stopped delay" ? ", short enough to be a slow Stopped in this file" : s.flag ? `, with ${s.flag} in front` : "") + (s.grade ? " · " + s.grade : "") + (+s.n ? " · inside a car session" : ""), {min: 2});
    else if (s.kind === "service") g += bar(s, lane.service, s.flag === "clean" ? `hsl(${appHue(s.app)} 45% 60%)` : s.flag === "review" ? "#f3d9a4" : "#f1c7c7",
      `service: ${s.app} (${s.flag === "clean" ? "no long silence inside" : s.flag === "review" ? "a silence of 30 min to 6 h inside: check" : "stop lost: shutdown or silence of 6 h or more inside"})` + (+s.n ? " · inside a car session" : ""), {dash: s.flag !== "clean"});
    else if (s.kind === "service_mark") { if (t1 - t0 <= 6 * 3600) g += mark(s, lane.service, "#b00", s.app + ": service " + s.flag); }
    else if (s.kind === "car_incomplete") g += bar(s, lane.car, "#f1e9fb", "car session? " + s.flag, {dash: true, min: 3});
    else if (s.kind === "car_maps") g += bar(s, lane.car, "#7b4fc4", "Maps on the car screen (Maps service)");
  }
  for (const s of d.chain || []) g += bar(s, lane.chain, "#5b6b7f", `chain of ${s.n_nodes} app${s.n_nodes > 1 ? "s in a row" : ""}: ${s.path}` +
      (s.start_logged === "False" || s.start_logged === false ? " · start not logged" : "") + (s.end_logged === "False" || s.end_logged === false ? " · end not logged" : ""),
    {dash: !(String(s.start_logged) === "True" || s.start_logged === true) || !(String(s.end_logged) === "True" || s.end_logged === true)});
  for (const s of d.app) g += s.flag === "no start" ? mark(s, lane.app, "#b00", s.app + " paused with no start")
    : bar(s, lane.app, `hsl(${appHue(s.app)} 55% 55%)`, s.app + (s.flag ? " (" + s.flag + ")" : ""), {dash: s.flag === "no pause"});
  g += `<rect x="${X(b.start)}" y="${top}" width="${Math.max(2, X(b.end) - X(b.start))}" height="${PF_LANES.length * lh}" fill="none" stroke="var(--accent)" stroke-width="1.5"/>`;
  for (let i = 0; i <= 4; i++) { const t = t0 + (t1 - t0) * i / 4;
    g += `<text x="${X(t)}" y="${H - 6}" font-size="10" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}" fill="var(--muted, #666)">${fmt(t, b.tz, "mdt")}</text>`; }
  el.innerHTML = `<svg width="${W}" height="${H}" style="display:block;max-width:100%">${g}</svg>
    <div class="small">Small window: an app paused but not stopped for 10 s or more while another app is in front (picture-in-picture). Service: a foreground service of an app from start to stop, at least 1 min (dashed: a long silence inside; red tick: start or stop with no partner, shown when zoomed to 6 h or less). App chain: user apps handing over to each other within 1 s (dashed: an end was not logged). Car screen: Android Auto session (light) with Maps projected (dark). Power: shutdown, startup, User Unlocked, boot storm and the Off stretch between them. Dashed red outline: the closing event was lost. Red tick in the app lane: a pause with no start. Hover a segment for details.</div>`;
}

function renderBlockEvents() {
  const d = BL.data, b = d.block, tz = b.tz, [bi0, bi1] = d.block_i, N = d.n_events_total;
  const vis = BL.events.filter(e => e.skip || BL.showHB || e.cls !== "heartbeat" || e.i === bi0 || e.i === bi1);
  const real = vis.filter(e => !e.skip);
  let maxgap = 0;
  for (let k = 1; k < real.length; k++) maxgap = Math.max(maxgap, real[k].t - real[k - 1].t);
  const first = BL.events.find(e => !e.skip), last = [...BL.events].reverse().find(e => !e.skip);
  let prev = null, html = `<button class="loadmore" id="bl-earlier" ${first.i <= 0 ? "disabled" : ""}>${first.i <= 0 ? "start of the log" : `▲ load ${BL_STEP} earlier events`}</button>
    <table><thead><tr><th>#</th><th>Time (${esc(tz)})</th><th class="num">Since previous shown</th><th>Event</th><th>Class</th><th>App</th></tr></thead><tbody>`;
  for (const e of vis) {
    if (e.skip) {
      html += `<tr class="skip"><td colspan="6">… ${(e.to - e.from - 1).toLocaleString()} events inside the block not loaded · <a href="#" class="fill">load ${BL_STEP} more</a> …</td></tr>`;
      prev = null;

    html += `<tr class="${inb ? "inblock" : ""} ${e.cls === "heartbeat" ? "hb" : ""}"><td class="small">${e.i}</td>

      <td class="num ${gap != null && gap > 0 && gap === maxgap ? "biggap" : ""}">${gap == null ? "" : dur(gap)}</td>
      <td>${evCell(e)}</td><td>${e.cls}</td><td>${esc(e.label || e.app)} <span class="pkg">${esc(e.app)}</span></td></tr>`;
    if (e.i === bi0) html += `<tr class="mark" id="bl-start"><td colspan="6">⋯ quiet stretch: ${dur(b.duration_s)} with no event · ${b.label} ⋯</td></tr>`;
  }
  html += `</tbody></table><button class="loadmore" id="bl-later" ${last.i >= N - 1 ? "disabled" : ""}>${last.i >= N - 1 ? "end of the log" : `▼ load ${BL_STEP} later events`}</button>`;
  $("#bl-evs").innerHTML = html;

  $("#bl-later").onclick = () => moreEvents("later");
  document.querySelectorAll("#bl-evs a.fill").forEach(a => a.onclick = ev => { ev.preventDefault(); moreEvents("middle"); });

async function moreEvents(where) {
  const fid = BL.data.block.file_id, box = $("#bl-evs");
  const first = BL.events.find(e => !e.skip), last = [...BL.events].reverse().find(e => !e.skip);
  if (where === "earlier") {
    const r = await api(`/api/states/events/${fid}?i0=${Math.max(0, first.i - BL_STEP)}&i1=${first.i}`);
    const h0 = box.scrollHeight, s0 = box.scrollTop;
    BL.events = r.events.concat(BL.events);
    renderBlockEvents();
    box.scrollTop = s0 + (box.scrollHeight - h0);       // keep the rows you were looking at in place
  } else if (where === "later") {
    const r = await api(`/api/states/events/${fid}?i0=${last.i + 1}&i1=${last.i + 1 + BL_STEP}`);
    const s0 = box.scrollTop;
    BL.events = BL.events.concat(r.events);

    box.scrollTop = s0;
  } else {
    const k = BL.events.findIndex(e => e.skip), sk = BL.events[k];
    const r = await api(`/api/states/events/${fid}?i0=${sk.from + 1}&i1=${Math.min(sk.to, sk.from + 1 + BL_STEP)}`);

    renderBlockEvents();
    box.scrollTop = s0;
  }
}

const SC = {list: [], intro: "", cur: null, timer: null, dirty: false};
const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
function mdInline(t) {
  return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
}
function md(src) {
  const L = src.split("\n"), out = [];
  let i = 0, stack = [];                       // open lists: {indent, tag}
  const closeTo = ind => { while (stack.length && stack[stack.length - 1].indent >= ind) out.push(`</li></${stack.pop().tag}>`); };
  while (i < L.length) {
    const ln = L[i];
    if (!ln.trim()) { i++; continue; }
    if (ln.trim().startsWith("|")) {           // table
      closeTo(0);
      const rowsT = [];
      while (i < L.length && L[i].trim().startsWith("|")) { rowsT.push(L[i].trim()); i++; }
      const cells = r => r.replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const head = cells(rowsT[0]), body = rowsT.slice(rowsT[1] && /^\|[\s:|-]+\|$/.test(rowsT[1]) ? 2 : 1);
      out.push(`<div class="tblwrap"><table><thead><tr>${head.map(c => `<th>${mdInline(c)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r => `<tr>${cells(r).map(c => `<td>${mdInline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    const m = ln.match(/^(\s*)(-|\d+\.)\s+(.*)$/);
    if (m) {
      const ind = m[1].length, tag = m[2] === "-" ? "ul" : "ol";
      const top = stack[stack.length - 1];
      if (!top || ind > top.indent) { out.push(`<${tag}><li>`); stack.push({indent: ind, tag}); }
      else { closeTo(ind + 1); const t2 = stack[stack.length - 1];
        if (t2 && t2.indent === ind && t2.tag === tag) out.push("</li><li>");
        else { closeTo(ind); out.push(`<${tag}><li>`); stack.push({indent: ind, tag}); } }
      out.push(mdInline(m[3]));
      i++; continue;
    }
    const ind = ln.match(/^\s*/)[0].length;
    if (stack.length && ind > 0) { out.push(`<p>${mdInline(ln.trim())}</p>`); i++; continue; }   // continuation inside a list item
    closeTo(0);
    out.push(`<p>${mdInline(ln.trim())}</p>`); i++;
  }
  closeTo(0);
  return `<div class="md">${out.join("")}</div>`;
}

// Triplet colours (David, 10-17): pair Resumed -> Paused -> Stopped per app with a FIFO queue: every Resumed opens a

  $("#sch-next").onclick = () => k < vis.length - 1 && openSch(vis[k + 1].id);
  document.querySelectorAll("#sch-detail .vbtns button").forEach(b => b.onclick = () => {
    const v = b.dataset.v === it.verdict ? "" : b.dataset.v;
    schSave(it, {verdict: v, comment: $("#sch-text").value});
    document.querySelectorAll("#sch-detail .vbtns button").forEach(x => x.classList.toggle("on", x.dataset.v === v));
  });
  const ta = $("#sch-text");
  ta.oninput = () => { SCH.dirty = true; $("#sch-state").textContent = "Editing…"; clearTimeout(SCH.timer); SCH.timer = setTimeout(schFlush, 800); };
  ta.onblur = schFlush;
  $("#sch-detail").scrollTop = 0;
}
document.addEventListener("keydown", e => {
  if (!$("#sch").classList.contains("on") || ["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const vis = schVisible(), k = vis.findIndex(i => i.id === SCH.cur);
  if ((e.key === "j" || e.key === "ArrowDown" || e.key === "ArrowRight") && k < vis.length - 1) { e.preventDefault(); openSch(vis[k + 1].id); }
  if ((e.key === "k" || e.key === "ArrowUp" || e.key === "ArrowLeft") && k > 0) { e.preventDefault(); openSch(vis[k - 1].id); }
});
window.addEventListener("beforeunload", () => { if (SCH.dirty) schFlush(); });
if (location.hash.startsWith("#sch")) showTab("sch");
</script>
</body>
</html>
